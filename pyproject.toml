[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nautobot-app-phones"
version = "2026.5.4"
description = "Multi-vendor campus phone-system inventory for Nautobot — mirrors Cisco UCM (AXL) and FreePBX into a unified data model."
requires-python = ">=3.10"
authors = [{ name = "Ryan Malloy", email = "ryan@supported.systems" }]
keywords = [
    "nautobot",
    "nautobot-app",
    "nautobot-plugin",
    "ssot",
    "diffsync",
    "telephony",
    "voip",
    "cisco-ucm",
    "callmanager",
    "freepbx",
    "axl",
    "did",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
]
dependencies = [
    "nautobot>=3.0,<4",
    "nautobot-ssot>=4.2,<5",
]

[project.optional-dependencies]
cisco_ucm = [
    "zeep>=4.2,<5",
]
freepbx = [
    "httpx>=0.27,<1",
    # pymysql is for the DB-direct fallback path used when FreePBX's `api`
    # module hasn't yet exposed a resource via GraphQL (currently: trunks,
    # outbound routes). Read-only SELECT queries against MariaDB only.
    "pymysql>=1.1,<2",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocs-include-markdown-plugin>=6.2,<8",
]
all = [
    "nautobot-app-phones[cisco_ucm,freepbx]",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "vcrpy>=6.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nautobot_phones"]

[tool.hatch.build.targets.sdist]
exclude = [
    "CLAUDE.md",
    ".env",
    ".env.local",
    ".mcp.json",
    "/local/",
    "audits/",
    "tests/",
    ".pytest_cache/",
    ".ruff_cache/",
    "dist/",
    "build/",
    "development/",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/nautobot_phones/migrations/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
