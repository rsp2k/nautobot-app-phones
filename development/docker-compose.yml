# Dev stack for nautobot-app-phones.
#
# 4 containers: postgres + redis + nautobot-web + nautobot-worker.
# Reverse-proxied via caddy-docker-proxy on the external `caddy` network.
# Plugin source bind-mounted from ../src for hot-reload (restart web to apply).

# Pin the docker compose project name explicitly so volume + network names
# don't fall back to the working directory ("development"), which would
# collide with any other project run from a `development/` subdir.
name: ${COMPOSE_PROJECT:-nautobot-phones-dev}

x-nautobot-common: &nautobot-common
  build:
    context: ..
    dockerfile: development/Dockerfile
  image: nautobot-app-phones-dev:latest
  restart: unless-stopped
  environment:
    NAUTOBOT_ALLOWED_HOSTS: "${DOMAIN} nautobot-web localhost 127.0.0.1"
    NAUTOBOT_DB_HOST: postgres
    NAUTOBOT_DB_PORT: "5432"
    NAUTOBOT_DB_NAME: ${NAUTOBOT_DB_NAME}
    NAUTOBOT_DB_USER: ${NAUTOBOT_DB_USER}
    NAUTOBOT_DB_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
    NAUTOBOT_REDIS_HOST: redis
    NAUTOBOT_REDIS_PORT: "6379"
    NAUTOBOT_REDIS_PASSWORD: ${NAUTOBOT_REDIS_PASSWORD}
    NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
    NAUTOBOT_SUPERUSER_NAME: ${NAUTOBOT_SUPERUSER_NAME}
    NAUTOBOT_SUPERUSER_EMAIL: ${NAUTOBOT_SUPERUSER_EMAIL}
    NAUTOBOT_SUPERUSER_PASSWORD: ${NAUTOBOT_SUPERUSER_PASSWORD}
    NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_SUPERUSER_API_TOKEN}
    NAUTOBOT_CREATE_SUPERUSER: "true"
    # Cisco UCM AXL credentials — read by Nautobot's environment-variable
    # secrets provider via a SecretsGroup attached to the PhoneSystem record.
    AXL_URL: ${AXL_URL:-}
    AXL_USER: ${AXL_USER:-}
    AXL_PASS: ${AXL_PASS:-}
    # AXL WSDL location inside the container. Default: /opt/axl/<version>/AXLAPI.wsdl.
    # Override AXL_WSDL_PATH to point elsewhere if you mount the WSDL differently.
    AXL_VERSION: ${AXL_VERSION:-15.0}
    AXL_WSDL_PATH: ${AXL_WSDL_PATH:-}
    # FreePBX (Phase 5).
    FREEPBX_LAB_HOST: ${FREEPBX_LAB_HOST:-}
    FREEPBX_LAB_TOKEN: ${FREEPBX_LAB_TOKEN:-}
    PYTHONUNBUFFERED: "1"
  volumes:
    # Custom config (PLUGINS list, PLUGINS_CONFIG, debug toggles).
    - ./nautobot_config/nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
    # Hot-reload our plugin source.
    - ../src:/opt/plugin/src
    # AXL WSDL bundle — read-only. Layout matches AXLClient's default
    # AXL_WSDL_ROOT/<version>/AXLAPI.wsdl resolution. Sourced from the
    # lab/axl project's pre-extracted cache so we don't unzip per-stack.
    - ${HOME}/.cache/mcaxl/wsdl:/opt/axl:ro
    # Persistent state.
    - nautobot-static:/opt/nautobot/static
    - nautobot-media:/opt/nautobot/media
    - nautobot-git-repos:/opt/nautobot/git
  # Pin AXL hostname → BASTION_HOST IP so docker's internal DNS forwarder
  # isn't on the critical path. Set AXL_HOST to the bare hostname (no
  # scheme/port) and BASTION_HOST to the routable IP. Both must be set;
  # docker-compose interpolation doesn't parse AXL_URL.
  extra_hosts:
    - "${AXL_HOST:-axl-host-unset.invalid}:${BASTION_HOST:-127.0.0.1}"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nautobot-init:
      condition: service_completed_successfully

services:
  # One-shot: chown the named volumes to UID 999 (nautobot) before the app
  # containers start. Docker creates named-volume root dirs as root:root,
  # which the non-root nautobot user can't write to. Idempotent — safe to
  # re-run on every `up`.
  nautobot-init:
    image: nautobot-app-phones-dev:latest
    container_name: ${COMPOSE_PROJECT}-init
    user: "0"
    restart: "no"
    # Override entrypoint to bypass the upstream docker-entrypoint.sh — that
    # script tries to wait on the DB/redis, which requires env vars we don't
    # pass to this one-shot. We just want to chown the volumes and exit.
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /opt/nautobot/media /opt/nautobot/static /opt/nautobot/git && echo 'volumes chowned'"]
    volumes:
      - nautobot-static:/opt/nautobot/static
      - nautobot-media:/opt/nautobot/media
      - nautobot-git-repos:/opt/nautobot/git
    networks:
      - internal
    depends_on:
      - postgres
      - redis


  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NAUTOBOT_DB_NAME}
      POSTGRES_USER: ${NAUTOBOT_DB_USER}
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT}-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NAUTOBOT_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NAUTOBOT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nautobot-web:
    <<: *nautobot-common
    container_name: ${COMPOSE_PROJECT}-web
    # Loopback-only port mapping so we can hit Nautobot directly from
    # the host (useful for Playwright + curl testing). Caddy still
    # reverse-proxies via the labels below for normal browser access.
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - internal
      - caddy
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: "gzip zstd"

  nautobot-worker:
    <<: *nautobot-common
    container_name: ${COMPOSE_PROJECT}-worker
    # `command:` (not `entrypoint:`) so the upstream Nautobot
    # docker-entrypoint.sh still runs first — it creates media/static dirs
    # with correct permissions before exec'ing whatever's passed here.
    command: ["nautobot-server", "celery", "worker", "-l", "INFO"]
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # FreePBX 17 dev container (Phase 5 — second-vendor adapter target).
  #
  # Image: escomputers/freepbx:17 (FreePBX 17.0.21 + Asterisk 21 + PHP 8.2 +
  # MariaDB 10.11). Started independently via `make freepbx-up` to keep first-
  # boot provisioning (3-5min) out of the default `make up` path.
  #
  # Static IPs on freepbx-net match the upstream image's expected DB host
  # (172.18.0.10). MariaDB credentials come via Docker file-based secrets
  # generated from .env by `make freepbx-init`.
  #
  # We don't expose RTP ports — the adapter only needs the GraphQL/REST API
  # at /admin/ which Caddy serves over HTTPS.
  # ---------------------------------------------------------------------------
  freepbx-mariadb:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT}-freepbx-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/freepbx_mysql_root_pw
      MYSQL_USER: freepbxuser
      MYSQL_PASSWORD_FILE: /run/secrets/freepbx_user_pw
    secrets:
      - freepbx_mysql_root_pw
      - freepbx_user_pw
    volumes:
      - freepbx-db-data:/var/lib/mysql
      - ./freepbx/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./freepbx/my.cnf:/etc/mysql/my.cnf:ro
    networks:
      freepbx-net:
        ipv4_address: 172.18.0.10
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10

  freepbx:
    image: escomputers/freepbx:17
    container_name: ${COMPOSE_PROJECT}-freepbx
    restart: unless-stopped
    cap_add:
      # iptables manipulation for fail2ban rules — required by upstream image.
      - NET_ADMIN
    volumes:
      # Whole-dir persistence as required by the upstream image. Asterisk
      # state, FreePBX modules, generated configs all live under /var and
      # /etc; bind-volumes here means they survive container recreate.
      - freepbx-var:/var
      - freepbx-etc:/etc
    secrets:
      - freepbx_sasl_passwd
    networks:
      freepbx-net:
        ipv4_address: 172.18.0.20
      caddy:
    labels:
      caddy: ${FREEPBX_DOMAIN:-freepbx-dev.example.com}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.encode: "gzip zstd"
    depends_on:
      freepbx-mariadb:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  nautobot-static:
  nautobot-media:
  nautobot-git-repos:
  freepbx-db-data:
  freepbx-var:
  freepbx-etc:

secrets:
  freepbx_mysql_root_pw:
    file: ./freepbx/secrets/mysql_root_pw.txt
  freepbx_user_pw:
    file: ./freepbx/secrets/freepbxuser_pw.txt
  freepbx_sasl_passwd:
    file: ./freepbx/secrets/sasl_passwd.txt

networks:
  internal:
    driver: bridge
  caddy:
    external: true
  # Isolated subnet for the FreePBX container pair. Static IPs match what
  # escomputers/freepbx:17 expects internally (the image references the DB
  # at 172.18.0.10). Subnet 172.18.0.0/16 doesn't collide with our existing
  # docker bridge networks (all in 10.10.0.0/12 chunks).
  freepbx-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
