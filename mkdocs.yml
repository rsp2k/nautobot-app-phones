---
dev_addr: "127.0.0.1:8001"
edit_uri: "edit/main/docs"
site_dir: "src/nautobot_phones/static/nautobot_phones/docs"
site_name: "Nautobot Phones Documentation"
repo_url: "https://git.supported.systems/nautobot-app-phones"
copyright: "Copyright &copy; Ryan Malloy"

theme:
  name: "material"
  navigation_depth: 4
  hljs_languages:
    - "django"
    - "yaml"
    - "python"
  features:
    - "navigation.tracking"
    - "navigation.tabs"
    - "navigation.tabs.sticky"
    - "navigation.footer"
    - "navigation.indexes"
    - "search.suggest"
    - "search.highlight"
    - "search.share"
    - "content.action.edit"
    - "content.action.view"
    - "content.code.copy"
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: "default"
      primary: "indigo"
      accent: "indigo"
      toggle:
        icon: "material/weather-sunny"
        name: "Switch to dark mode"

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: "slate"
      primary: "indigo"
      accent: "indigo"
      toggle:
        icon: "material/weather-night"
        name: "Switch to light mode"

extra_css:
  - "assets/extra.css"

markdown_extensions:
  - "admonition"
  - "toc":
      permalink: true
  - "attr_list"
  - "md_in_html"
  - "pymdownx.details"
  - "pymdownx.highlight":
      anchor_linenums: true
  - "pymdownx.inlinehilite"
  - "pymdownx.snippets"
  - "pymdownx.superfences"
  - "pymdownx.tabbed":
      alternate_style: true
  - "footnotes"
  - "tables"

plugins:
  - "search"
  - "include-markdown"

watch:
  - "README.md"

nav:
  - "Overview": "index.md"
  - "User Guide":
    - "App Overview": "user/app_overview.md"
    - "Use Cases": "user/use_cases.md"
    - "Sync Reference": "user/sync_reference.md"
    - "Models": "user/models.md"
    - "FAQ": "user/faq.md"
  - "Administrator Guide":
    - "Install": "admin/install.md"
    - "Compatibility Matrix": "admin/compatibility_matrix.md"
    - "Upgrade": "admin/upgrade.md"
    - "Uninstall": "admin/uninstall.md"
    - "Release Notes":
      - "admin/release_notes/index.md"
  - "Developer Guide":
    - "Contributing": "dev/contributing.md"
    - "Development Environment": "dev/dev_environment.md"
    - "Architecture Decisions": "dev/architecture.md"
    - "Extending": "dev/extending.md"
