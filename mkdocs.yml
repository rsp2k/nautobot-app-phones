---
dev_addr: "127.0.0.1:8001"
edit_uri: "edit/main/docs"
site_dir: "src/nautobot_phones/static/nautobot_phones/docs"
site_name: "Nautobot Phones Documentation"
# `repo_url` powers the "Edit this page" + "View source" links on every
# page (rendered via `edit_uri` above). Pointing at GitHub since that's
# what Read the Docs pulls from.
repo_url: "https://github.com/rsp2k/nautobot-app-phones"
copyright: "Copyright &copy; Ryan Malloy"

theme:
  name: "material"
  navigation_depth: 4
  custom_dir: "docs/assets/overrides"
  hljs_languages:
    - "django"
    - "yaml"
    - "python"
  features:
    - "content.action.edit"
    - "content.action.view"
    - "content.code.copy"
    - "navigation.footer"
    - "navigation.indexes"
    - "navigation.tabs"
    - "navigation.tabs.sticky"
    - "navigation.tracking"
    - "search.highlight"
    - "search.share"
    - "search.suggest"
  favicon: "assets/favicon.ico"
  logo: "assets/nautobot_logo.svg"
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: "default"
      primary: "black"
      toggle:
        icon: "material/weather-sunny"
        name: "Switch to dark mode"

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: "slate"
      primary: "black"
      toggle:
        icon: "material/weather-night"
        name: "Switch to light mode"

extra_css:
  - "assets/extra.css"

extra:
  generator: false

markdown_extensions:
  - "admonition"
  - "toc":
      permalink: true
  - "attr_list"
  - "md_in_html"
  - "meta"
  - "pymdownx.details"
  - "pymdownx.highlight":
      anchor_linenums: true
  - "pymdownx.inlinehilite"
  - "pymdownx.snippets"
  - "pymdownx.superfences":
      custom_fences:
        - name: "mermaid"
          class: "mermaid"
          format: !!python/name:pymdownx.superfences.fence_code_format
  - "footnotes"
  - "tables"
  # `+++ "X.Y" New in version` callout blocks — canonical Nautobot
  # docs convention for noting which release added a feature.
  - "markdown_version_annotations":
      admonition_tag: "???"
  - "pymdownx.blocks.caption"

plugins:
  - "search"
  - "include-markdown"
  # Auto-generated API reference from docstrings. The dev/code_reference/
  # pages drive what's rendered.
  - "mkdocstrings":
      default_handler: "python"
      handlers:
        python:
          # `paths: ["src"]` lets griffe resolve `nautobot_phones.*` to
          # src/nautobot_phones/ without needing the package installed.
          # AST parsing only — no Django/Nautobot imports required, which
          # keeps RTD builds fast (~10s vs the multi-minute cost of pulling
          # in the framework).
          paths: ["src"]
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            members_order: "source"
  # Image lightbox for screenshots — clicking opens full-size.
  - "glightbox"

# Catch broken refs at build time. `omitted_files` warns when a file
# in docs/ isn't referenced from nav. `unrecognized_links` and
# `anchors` catch typos in cross-page links.
validation:
  omitted_files: "warn"
  absolute_links: "warn"
  unrecognized_links: "warn"
  anchors: "warn"

watch:
  - "README.md"

nav:
  - "Overview": "index.md"
  - "User Guide":
    - "App Overview": "user/app_overview.md"
    - "Getting Started": "user/app_getting_started.md"
    - "Use Cases": "user/use_cases.md"
    - "Sync Reference": "user/sync_reference.md"
    - "SIP Cut Sheet Ingest": "user/cut_sheet_ingest.md"
    - "DID Heatmap": "user/did_heatmap.md"
    - "Dial-Plan Trace": "user/dialplan_trace.md"
    - "Models": "user/models.md"
    - "External Interactions": "user/external_interactions.md"
    - "FAQ": "user/faq.md"
  - "Data Models":
    - "Index": "models/index.md"
    - "System":
      - "PhoneSystem": "models/phonesystem.md"
      - "SipCircuitProfile": "models/sipcircuitprofile.md"
    - "Dial plan":
      - "Partition": "models/partition.md"
      - "CallingSearchSpace": "models/callingsearchspace.md"
      - "CSSPartitionMembership": "models/csspartitionmembership.md"
    - "Numbers":
      - "DirectoryNumber": "models/directorynumber.md"
      - "DIDBlock": "models/didblock.md"
      - "DID": "models/did.md"
      - "DIDAssignment": "models/didassignment.md"
    - "Endpoints":
      - "Phone": "models/phone.md"
      - "Line": "models/line.md"
      - "SpeedDial": "models/speeddial.md"
      - "BusyLampField": "models/busylampfield.md"
      - "PhoneServiceUrl": "models/phoneserviceurl.md"
    - "Routing":
      - "Trunk": "models/trunk.md"
      - "RouteList": "models/routelist.md"
      - "RouteGroup": "models/routegroup.md"
      - "RouteListMember": "models/routelistmember.md"
      - "RouteGroupMember": "models/routegroupmember.md"
      - "RoutePattern": "models/routepattern.md"
      - "TranslationPattern": "models/translationpattern.md"
    - "Hunt subsystem":
      - "HuntPilot": "models/huntpilot.md"
      - "HuntList": "models/huntlist.md"
      - "LineGroup": "models/linegroup.md"
      - "HuntListMember": "models/huntlistmember.md"
      - "LineGroupMember": "models/linegroupmember.md"
    - "Analog":
      - "AnalogGateway": "models/analoggateway.md"
      - "AnalogPort": "models/analogport.md"
    - "Feature config":
      - "DeviceProfile": "models/deviceprofile.md"
      - "VoicemailProfile": "models/voicemailprofile.md"
      - "CallPickupGroup": "models/callpickupgroup.md"
      - "CallPickupGroupMember": "models/callpickupgroupmember.md"
  - "Administrator Guide":
    - "Install": "admin/install.md"
    - "Compatibility Matrix": "admin/compatibility_matrix.md"
    - "Upgrade": "admin/upgrade.md"
    - "Uninstall": "admin/uninstall.md"
    - "Publishing Docs": "admin/install_docs_site.md"
    - "Release Notes":
      - "admin/release_notes/index.md"
  - "Developer Guide":
    - "Contributing": "dev/contributing.md"
    - "Development Environment": "dev/dev_environment.md"
    - "Architecture Decisions": "dev/architecture.md"
    - "Extending": "dev/extending.md"
    - "Code Reference":
      - "dev/code_reference/index.md"
      - "Package": "dev/code_reference/package.md"
      - "API": "dev/code_reference/api.md"
  - "Nautobot Docs Home ↗︎": "https://docs.nautobot.com"
